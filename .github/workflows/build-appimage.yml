name: Build AppImage (manylinux2.28)

# Build a portable screenkey AppImage using the manylinux_2_28_x86_64 base
# image (AlmaLinux 8 -> glibc 2.28) so the resulting AppImage runs on most
# modern x86_64 Linux distributions.
#
# Pipeline overview
#   1. Install system libs (gtk3 / x11 / dbus / slop / fontawesome).
#   2. Use the manylinux-bundled CPython 3.11 and pip-install PyGObject,
#      pycairo, dbus-python and babel (compiled against the system GTK
#      headers) directly into the AppDir site-packages.
#   3. Copy the Screenkey/ package directory into the AppDir site-packages
#      and compile translations (.po -> .mo) with babel.
#   4. Drop a `screenkey` launcher script into AppDir/usr/bin.
#   5. Stage desktop/metainfo/icon + AppRun entry script.
#   6. linuxdeploy + linuxdeploy-plugin-gtk bundle all runtime .so and
#      girepository files into AppDir/usr/lib.
#   7. Stage the `slop` binary into AppDir/usr/bin (screenkey spawns it as
#      a subprocess for interactive region selection); its NEEDED libs are
#      picked up by the closure pass in step 8.
#   8. Close transitive .so closure with ldd + inject DT_RUNPATH via
#      patchelf, and verify slop's deps resolve inside AppDir/usr/lib.
#   9. appimagetool (run extracted, no FUSE) packs AppDir -> *.AppImage.
#  10. AppImage is uploaded as a workflow artifact and (on tag) released.
#
# Why we don't run `python3 setup.py install`:
#   setup.py declares `scripts=['screenkey']`, but the upstream `screenkey`
#   launcher script is not present in this repository. Calling setup.py
#   would fail with "file 'screenkey' does not exist". Instead we install
#   the package by hand (copy + a launcher script identical to upstream).

on:
  push:
    tags: ['v*']
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  APP_NAME: screenkey
  PYVER: "3.11"
  # CPython ABI tag used by the manylinux image (cp311 == CPython 3.11).
  PYABI: cp311

jobs:
  build:
    name: Build screenkey AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y epel-release
          dnf install -y \
            gtk3 gtk3-devel \
            adwaita-icon-theme \
            gobject-introspection gobject-introspection-devel \
            cairo-gobject-devel cairo-devel \
            glib2-devel \
            pango-devel atk-devel \
            gdk-pixbuf2 gdk-pixbuf2-devel \
            libX11 libX11-devel \
            dbus dbus-libs dbus-devel \
            libappindicator-gtk3 \
            slop \
            fontawesome-fonts \
            google-noto-sans-cjk-ttc-fonts \
            desktop-file-utils \
            appstream \
            wget file cpio \
            gettext \
            pkgconf-pkg-config \
            libffi-devel libmount-devel

      - name: Pick manylinux Python (${{ env.PYVER }})
        run: |
          # manylinux ships multiple CPython builds under /opt/python.
          # cp311-cp311 == CPython 3.11 (ABI tag: cp311).
          PYBIN="/opt/python/${{ env.PYABI }}-${{ env.PYABI }}/bin"
          echo "Using $(${PYBIN}/python3 --version) from ${PYBIN}"
          ln -sf "${PYBIN}/python3" /usr/local/bin/python3
          ln -sf "${PYBIN}/pip3"    /usr/local/bin/pip3
          python3 -m pip install --upgrade pip setuptools wheel

      - name: Compile translations (.po -> .mo)
        run: |
          # setup.cfg points compile_catalog at Screenkey/locale; babel is
          # available via the manylinux image's site-packages.
          python3 -m pip install babel
          python3 setup.py compile_catalog

      - name: Validate build prerequisites (pkg-config / python deps)
        run: |
          set -eu
          # Fail EARLY with clear messages instead of the opaque
          # `metadata-generation-failed` that pip wraps setup.py/meson errors in.
          echo "== pkg-config binary =="
          command -v pkg-config && pkg-config --version
          echo "== pkg-config modules =="
          for mod in gobject-introspection-1.0 gtk+-3.0 cairo cairo-gobject dbus-1 glib-2.0; do
            pkg-config --exists "$mod" && echo "OK  $mod ($(pkg-config --modversion "$mod"))" \
              || { echo "MISSING $mod"; pkg-config --print-errors --exists "$mod"; exit 1; }
          done
          echo "== setuptools wheel pip versions =="
          pip3 show setuptools wheel pip | grep -E '^(Name|Version):'

      - name: Install Python runtime deps (build to system site-packages first)
        env:
          # pycairo's pip-install does NOT install py3cairo.pc (only meson or
          # `setup.py install` do), and PyGObject's setup.py requires it via
          # `pkg-config --cflags py3cairo`. We generate it manually below and
          # expose it through PKG_CONFIG_PATH.
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig:/usr/lib/pkgconfig:/usr/lib64/pkgconfig
        run: |
          set -eu
          SP="AppDir/usr/lib/python${PYVER}/site-packages"
          mkdir -p "$SP" AppDir/usr/bin
          SYS_SP="$(python3 -c 'import site; print(site.getsitepackages()[0])')"
          echo "System site-packages: $SYS_SP"
          echo "Target AppDir site-packages: $SP"

          # ---- 1. Build pycairo to system site-packages -------------------
          pip3 install -vvv --no-deps --no-build-isolation \
            pycairo==1.26.0
          python3 -c "import cairo; print('OK  pycairo', cairo.version_info)"

          # ---- 2. Locate or generate py3cairo.pc --------------------------
          # pycairo 1.26 installed via pip drops py3cairo.pc next to the
          # package OR not at all (depends on which command ran install_pkgconfig).
          # Search everywhere first; fall back to generating it manually using
          # the actual install prefix so PyGObject's pkg-config lookup works.
          PYCAIRO_DIR="$(python3 -c 'import cairo, os; print(os.path.dirname(cairo.__file__))')"
          PYCAIRO_VER="$(python3 -c 'import cairo; print(".".join(map(str, cairo.version_info)))')"
          PYCAIRO_PREFIX="$(python3 -c 'import sys; print(sys.prefix)')"
          echo "pycairo package dir: $PYCAIRO_DIR"
          echo "pycairo version:     $PYCAIRO_VER"
          echo "pycairo prefix:      $PYCAIRO_PREFIX"

          PC_FILE="$(find / -name 'py3cairo.pc' 2>/dev/null | head -n1 || true)"
          if [ -n "$PC_FILE" ]; then
            echo "Found existing py3cairo.pc at: $PC_FILE"
            PC_DIR="$(dirname "$PC_FILE")"
          else
            echo "py3cairo.pc not installed by pip; generating one next to the package"
            PC_DIR="$PYCAIRO_DIR"
            # pycairo ships its header as `pycairo.h` inside the package dir,
            # so cflags must point at $PYCAIRO_DIR (so `#include <pycairo.h>` resolves).
            cat > "$PC_DIR/py3cairo.pc" <<EOF
          prefix=$PYCAIRO_PREFIX
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=$PYCAIRO_DIR

          Name: Pycairo
          Description: Python bindings for cairo
          Version: $PYCAIRO_VER
          Requires: cairo
          Cflags: -I\${includedir}
          EOF
          fi
          export PKG_CONFIG_PATH="$PC_DIR:$PKG_CONFIG_PATH"
          pkg-config --exists py3cairo \
            && echo "OK  py3cairo.pc ($(pkg-config --modversion py3cairo))" \
            || { echo "STILL MISSING py3cairo.pc; PKG_CONFIG_PATH=$PKG_CONFIG_PATH"; exit 1; }
          ls -la "$PC_DIR/py3cairo.pc" 2>/dev/null || true
          # Verify pycairo.h is actually findable via the cflags we just set.
          echo "py3cairo cflags: $(pkg-config --cflags py3cairo)"
          ls -la "$(pkg-config --cflags-only-I py3cairo | sed 's/^-I//')/pycairo.h" 2>/dev/null \
            || echo "WARN: pycairo.h not at expected location; PyGObject build may still fail"

          # ---- 3. Build PyGObject (setuptools) + dbus-python (prebuilt whl) -
          # Adaptability analysis for manylinux2.28 (AlmaLinux 8, glibc 2.28):
          #   - pycairo 1.26.0:        setuptools build, OK (py3cairo.pc generated)
          #   - PyGObject 3.44.1:      setuptools build, OK (requires g-i >=1.46.0;
          #                           AlmaLinux 8 ships 1.56.1)
          #   - PyGObject 3.48.2:      REJECTED (requires g-i >=1.64.0)
          #   - dbus-python 1.2.18:    setuptools source build fails on Python 3.11
          #                           with modern setuptools ("No available output")
          #   - dbus-python 1.3.2:     meson-python backend; test binaries link
          #                           -lpython3.11 which manylinux doesn't provide
          #                           (static python: libpython3.11.a only)
          # Solution for dbus-python: use the prebuilt cp311 linux_x86_64 wheel
          # from the espressif PyPI mirror (released 2020, glibc << 2.28, so
          # compatible with manylinux2.28). Skip meson entirely.
          pip3 install -vvv --no-deps --no-build-isolation PyGObject==3.44.1

          # dbus-python: download prebuilt wheel directly (no source build).
          # The wheel tags (cp311-cp311-linux_x86_64) are accepted by pip when
          # installed from a local file path.
          wget -q https://dl.espressif.com/pypi/dbus-python/dbus_python-1.2.18-cp311-cp311-linux_x86_64.whl
          pip3 install -vvv --no-deps dbus_python-1.2.18-cp311-cp311-linux_x86_64.whl
          python3 -c "import dbus; print('OK dbus', dbus.__version__)"

          pip3 install -vvv --no-deps --no-build-isolation babel==2.15.0

          # ---- 4. Copy compiled artifacts into AppDir ---------------------
          # IMPORTANT: dbus-python's prebuilt wheel puts its native C
          # extensions DIRECTLY in site-packages' TOP LEVEL, NOT under dbus/
          #   site-packages/_dbus_bindings.cpython-311-x86_64-linux-gnu.so
          #   site-packages/_dbus_glib_bindings.cpython-311-x86_64-linux-gnu.so
          # These are imported with `from _dbus_bindings import ...` in
          # dbus/types.py line 8 — if we only copy the `dbus/` directory the
          # native module can't be found, producing:
          #   ModuleNotFoundError: No module named '_dbus_bindings'
          # The copy list below therefore uses shell glob expansion on
          # `_dbus_*bindings*.so` so any native suffix is picked up.
          for item in pycairo PyGObject gi cairo cairo/_cairo*.so \
                       dbus dbus_python*.dist-info pycairo*.dist-info \
                       PyGObject*.dist-info babel*.dist-info \
                       _dbus_*bindings*.so; do
            for src in $SYS_SP/$item; do
              [ -e "$src" ] && cp -a "$src" "$SP/"
            done
          done
          # Verify both the pure-python dbus package AND its native C
          # extension are importable from the fresh AppDir copy.
          PYTHONPATH="$SP" python3 -c 'import cairo, gi, dbus, _dbus_bindings; print("imports OK from AppDir (dbus bindings: _dbus_bindings.__file__=" + _dbus_bindings.__file__ + ")")'

      - name: Copy Screenkey package into AppDir
        run: |
          set -eu
          SP="AppDir/usr/lib/python${PYVER}/site-packages"
          cp -a Screenkey "$SP/Screenkey"
          # Sanity-check the package is importable.
          PYTHONPATH="$SP" python3 -c 'import Screenkey; print(Screenkey.VERSION)'

      - name: Drop the `screenkey` launcher (matches upstream)
        run: |
          # This is the upstream launcher script from
          # https://gitlab.com/screenkey/screenkey/-/raw/master/screenkey
          # Inlined here because the file is not present in this repo.
          cat > AppDir/usr/bin/screenkey <<'PYEOF'
          #!/usr/bin/env python3
          # "screenkey" is distributed under GNU GPLv3+, WITHOUT ANY WARRANTY.
          # Copyright(c) 2010-2012: Pablo Seminario <pabluk@gmail.com>
          # Copyright(c) 2015-2020: wave++ "Yuri D'Elia" <wavexx@thregr.org>.

          from Screenkey import *

          import logging
          import os
          import re
          from argparse import ArgumentParser


          def parse_geom_fract(buf):
              if len(buf) == 0:
                  return 0
              if buf[-1] == '%':
                  v = int(buf[:-1])
                  if v == 0:
                      return 0
                  return v / 100
              return int(buf)


          def geometry(string):
              size = re.match(r'^(\d+%?)x(\d+%?)(?:([+-]\d+%?)([+-]\d+%?))?$', string)
              if size is None:
                  raise TypeError
              w = parse_geom_fract(size.group(1))
              h = parse_geom_fract(size.group(2))
              if w == 0 or h == 0:
                  raise TypeError
              x = parse_geom_fract(size.group(3)) if size.group(3) else 0
              y = parse_geom_fract(size.group(4)) if size.group(4) else 0
              return [x, y, w, h]


          def main():
              ap = ArgumentParser(description=APP_DESC)
              ap.add_argument("-d", "--debug", action="store_true",
                              help=_("enable debugging"))
              ap.add_argument("--no-systray", action="store_true",
                              help=_("do not create system tray icon"))
              ap.add_argument("-t", "--timeout", type=float, help=_("timeout in seconds"))
              ap.add_argument("-p", "--position", choices=POSITIONS,
                              help=_("set vertical position"))
              ap.add_argument("--persist", action='store_true', default=None,
                              help=_("make window persistent"))
              ap.add_argument("--window", action='store_true', default=None,
                              help=_("use a regular window for display (implies --persist)"))
              ap.add_argument("-s", "--font-size", choices=FONT_SIZES,
                              help=_("set font size"))
              ap.add_argument("-g", "--geometry", type=geometry,
                              help=_("set fixed area/window geometry"))
              ap.add_argument("--key-mode", choices=KEY_MODES,
                              help=_("set key processing mode"))
              ap.add_argument("--bak-mode", choices=BAK_MODES,
                              help=_("backspace processing mode"))
              ap.add_argument("--mods-mode", choices=MODS_MODES,
                              help=_("modifiers visualization mode"))
              ap.add_argument("-m", "--mods-only", action="store_true", default=None,
                              help=_("show only keys with modifiers pressed"))
              ap.add_argument("--multiline", action="store_true", default=None,
                              help=_("span text over multiple lines"))
              ap.add_argument("--vis-shift", action="store_true", default=None,
                              help=_("always show Shift when modifiers are pressed"))
              ap.add_argument("--no-whitespace", dest='vis_space', action="store_false", default=None,
                              help=_("disable visualization of whitespace"))
              ap.add_argument("--show-settings", action="store_true",
                              help=_("show settings dialog on start"))
              ap.add_argument("--scr", dest='screen', type=int,
                              help=_("show on the specified screen number"))
              ap.add_argument("-f", "--font", dest='font_desc',
                              help=_("set font family/weight"))
              ap.add_argument("--font-color", dest='font_color',
                              help=_("set font color"))
              ap.add_argument("--bg-color", dest='bg_color',
                              help=_("background color"))
              ap.add_argument("--opacity", dest='opacity', type=float,
                              help=_("window opacity (in range 0.0-1.0)"))
              ap.add_argument("--ignore", action='append', metavar='KeySym', default=[],
                              help=_("Ignore the specified KeySym"))
              ap.add_argument("--compr-cnt", type=int, metavar='COUNT',
                              help=_("Compress key repeats after the specified count"))
              ap.add_argument("--start-disabled", action='store_true', default=None,
                              help=_("do not display anything until explicitly requested"))
              ap.add_argument('--version', action='version', version=VERSION,
                              help=_("show version of screenkey"))
              ap.add_argument("-M", "--mouse", action="store_true", default=None,
                              help=_("show the mouse buttons"))
              ap.add_argument("--mouse-fade", type=float, dest='button_hide_duration',
                              help=_("Mouse buttons fade duration in seconds"))
              args = ap.parse_args()

              # Set options
              options = Options()
              for arg in ['timeout', 'position', 'persist', 'window', 'font_desc',
                          'font_color', 'bg_color', 'font_size', 'geometry',
                          'key_mode', 'bak_mode', 'mods_mode', 'mods_only',
                          'multiline', 'vis_shift', 'vis_space', 'screen',
                          'no_systray', 'opacity', 'ignore', 'compr_cnt',
                          'start_disabled', 'mouse', 'button_hide_duration']:
                  if getattr(args, arg) is not None:
                      options[arg] = getattr(args, arg)

              # Initialize logger
              if args.debug:
                  logging.basicConfig(level=logging.DEBUG)
              else:
                  logging.basicConfig(level=logging.INFO)
              logger = logging.getLogger(APP_NAME)

              import Screenkey.screenkey as sc
              app = sc.Screenkey(logger=logger, options=options, show_settings=args.show_settings)
              try:
                  exit(app.run())
              except KeyboardInterrupt:
                  os._exit(0)


          if __name__ == "__main__":
              main()
          PYEOF
          chmod +x AppDir/usr/bin/screenkey

      - name: Bundle the CPython interpreter
        run: |
          set -eu
          # manylinux's CPython is self-contained (no system-python linkage),
          # so we can ship it inside the AppImage.
          PYROOT="/opt/python/${{ env.PYABI }}-${{ env.PYABI }}"
          cp "$PYROOT/bin/python${PYVER}" "AppDir/usr/bin/python${PYVER}"
          # Copy the Python stdlib into AppDir so the bundled interpreter can
          # locate `encodings` and other core modules at runtime. Without this,
          # python falls back to the build-time prefix (/opt/_internal/...)
          # baked into the python-build-standalone binary and crashes with
          # "ModuleNotFoundError: No module named 'encodings'" on every host.
          # site-packages is skipped — it is already populated with the
          # compiled third-party packages (pycairo/PyGObject/dbus-python/...).
          for item in "$PYROOT/lib/python${PYVER}"/*; do
            [ "$(basename "$item")" = "site-packages" ] && continue
            cp -a "$item" "AppDir/usr/lib/python${PYVER}/"
          done
          # Sanity-check: encodings module must be present.
          ls "AppDir/usr/lib/python${PYVER}/encodings/__init__.py"

      - name: Stage python-dynload runtime libs (libffi.so.6, etc.)
        run: |
          set -eu
          # The CPython interpreter ships a set of C extensions under
          # lib/pythonX.Y/lib-dynload (e.g. _ctypes, _ssl, _lzma, ...).  Each
          # of those .so files may link additional system libraries such as
          # libffi.so.6 (_ctypes) or libssl/libcrypto (_ssl).  linuxdeploy
          # only scans ELF files reachable from the desktop Exec entry point
          # and the libraries it explicitly pulls in; because these python
          # modules are loaded dynamically at runtime via dlopen(), linuxdeploy
          # never follows their NEEDED entries and the host is left to provide
          # them.  That breaks on any distribution whose libffi SONAME differs
          # from AlmaLinux 8's (e.g. Kali ships libffi.so.8 only), producing:
          #   ImportError: libffi.so.6: cannot open shared object file
          #
          # A related and more subtle problem is "partial library reuse": the
          # GTK3 stack in the AppImage (libgtk-3, libpango, libgdk_pixbuf, ...)
          # may transitively pick up HOST versions of libharfbuzz / libfreetype
          # if linuxdeploy decided (correctly or by accident) NOT to bundle
          # those.  The host harfbuzz on Kali (8.x+) was built against a much
          # newer freetype that exports `FT_Get_Color_Glyph_Layer'; the bundled
          # libfreetype.so.6 (from AlmaLinux 8, ~2.9.x) does NOT export it,
          # so the loader ends up with:
          #   Failed to load shared library 'libgdk-3.so.0' referenced by the
          #   typelib: /lib/x86_64-linux-gnu/libharfbuzz.so.0: undefined symbol:
          #   FT_Get_Color_Glyph_Layer
          # followed by the cascading `gi.overrides.Gdk AssertionError`.
          #
          # To defeat both classes of problem we (a) force-copy the known
          # "troublemaker" libs (ffi + freetype + harfbuzz + pango/font stack)
          # and (b) run a full transitive ldd-closure copy AFTER linuxdeploy
          # so that every NEEDED entry – direct AND indirect – of every .so
          # under AppDir/usr (including lib-dynload) resolves to a copy shipped
          # inside the image, closing any accidental host leak.
          #
          # NOTE: every construct below is kept strictly POSIX /bin/sh
          # compatible (no bash-only process substitution, no local, no
          # arrays, no [[) because manylinux containers run Actions' run:
          # block via /bin/sh, and bash-only syntax produces the infamous
          # "syntax error near unexpected token `<'".
          DYNL="AppDir/usr/lib/python${PYVER}/lib-dynload"
          LIBDEST="AppDir/usr/lib"
          mkdir -p "$LIBDEST"
          TMP_LDD="$(mktemp /tmp/lddout.XXXXXX 2>/dev/null || echo /tmp/_ldd_screenkey)"
          trap 'rm -f "$TMP_LDD"' EXIT INT TERM
          echo "== Scanning lib-dynload dependencies =="
          echo "lib-dynload contents:"
          ls -1 "$DYNL" 2>/dev/null || true

          # Libraries that MUST be bundled.  We use both an explicit allow-list
          # (so we never accidentally bundle glibc/ld-linux/libgcc_s which the
          # AppImage project explicitly forbids) AND a copy-all-from-ldd pass.
          # The allow-list catches libffi reliably across rebuilds; the ldd pass
          # is a safety net for any other indirect dependency added later.
          # NOTE: `harfbuzz` and `freetype` and `fontconfig`/`pango` are listed
          # explicitly even though linuxdeploy-plugin-gtk might already drag
          # them in, because we want to ENSURE the build-host (AlmaLinux 8)
          # versions are used, not accidentally-leaked host copies.
          EXPLICIT_ALLOWLIST="libffi libssl libcrypto liblzma libbz2 libuuid libblkid libharfbuzz libfreetype libfontconfig libpango libpangocairo libpangoft2 libpng libthai libgraphite2 libpcre libpcre2 libselinux libsepol libcap libmount libdbus-1 libdbus-glib-1 libexpat libz"

          # find_soname <libname>
          # Prints the absolute path to the first matching SONAME entry from
          # ldconfig (e.g. "/lib64/libffi.so.6"), or nothing. POSIX grep + sed + awk
          # concatenation is used instead of awk variable-regex interpolation so
          # the expression is interpreted identically on every *nix awk flavour.
          find_soname() {
            _fn="$1"
            ldconfig -p 2>/dev/null \
              | grep -E "(^|[[:space:]])${_fn}\.so(\.[0-9]+)?($|[[:space:]])" \
              | awk '{print $NF}' \
              | head -n1
          }

          _copy_lib() {
            # Args: $1 = abs path to .so, $2 = label (for logging only)
            _src="$1"
            _label="$2"
            [ -n "$_src" ] && [ -f "$_src" ] || return 1
            _real="$(readlink -f "$_src")"
            _soname="$(basename "$_src")"
            _real_base="$(basename "$_real")"
            if [ -e "$LIBDEST/$_real_base" ]; then
              return 0   # already staged
            fi
            cp -a "$_real" "$LIBDEST/$_real_base"
            if [ "$_soname" != "$_real_base" ] && [ ! -e "$LIBDEST/$_soname" ]; then
              ( cd "$LIBDEST" && ln -sf "$_real_base" "$_soname" )
            fi
            echo "OK  $_label: $_soname -> $_real_base"
            _copied=$((_copied+1))
            return 0
          }

          _copied=0
          # ---- Explicit allow-list first (most reliable) -------------------
          for _libname in $EXPLICIT_ALLOWLIST; do
            _soname="$(find_soname "$_libname" || true)"
            if [ -z "$_soname" ]; then
              # ldconfig cache may be empty inside the container; fall back
              # to find (matches the first real .so.X file, not the bare .so).
              _soname="$(find /usr/lib64 /usr/lib /lib64 /lib -maxdepth 2 -name "${_libname}.so.*" -type f 2>/dev/null | head -n1 || true)"
              if [ -z "$_soname" ]; then
                _soname="$(find /usr/lib64 /usr/lib /lib64 /lib -maxdepth 2 -name "${_libname}.so" -type f 2>/dev/null | head -n1 || true)"
              fi
            fi
            if ! _copy_lib "$_soname" "allow-list: $_libname"; then
              echo "SKIP allow-list: $_libname (not found on build host)"
            fi
          done

          # ---- ldd safety-net pass (avoids glibc/gcc runtime) -------------
          # Skip libs whose SONAME starts with any of these prefixes.
          # NOTE: no bash local/readonly used; all vars prefixed with _ss_ to
          # avoid clobbering the outer scope.
          SKIP_PREFIXES="libc.so libdl.so libm.so libpthread.so librt.so libresolv.so libutil.so libnsl.so libnss_ libcrypt.so ld-linux ld-linux-x86 libgcc_s.so libstdc++.so libgpg-error.so"

          for so in "$DYNL"/*.so; do
            [ -f "$so" ] || continue
            # ldd prints lines such as:
            #   libffi.so.6 => /lib64/libffi.so.6 (0x...)
            # We first write the output to a temp file so we can `while read`
            # it from a regular redirect (no bash process substitution needed).
            ldd "$so" > "$TMP_LDD" 2>/dev/null || true
            while IFS= read -r _lddline; do
              # Extract the path after `=> /` up to the next whitespace.
              _path="$(echo "$_lddline" | sed -n 's/.*=>[[:space:]]*\(\/[^[:space:]]*\).*/\1/p')"
              [ -n "$_path" ] && [ -f "$_path" ] || continue
              _soname="$(basename "$_path")"
              # Skip if matches any prefix in SKIP_PREFIXES (POSIX case glob).
              _ss_skip=0
              for _pfx in $SKIP_PREFIXES; do
                case "$_soname" in
                  "$_pfx"*) _ss_skip=1; break ;;
                esac
              done
              [ "$_ss_skip" -eq 1 ] && continue
              # Already staged (by allow-list or earlier iteration)?
              if [ -e "$LIBDEST/$_soname" ]; then continue; fi
              _real="$(readlink -f "$_path")"
              _real_base="$(basename "$_real")"
              if [ -e "$LIBDEST/$_real_base" ]; then continue; fi
              cp -a "$_real" "$LIBDEST/$_real_base"
              if [ "$_soname" != "$_real_base" ] && [ ! -e "$LIBDEST/$_soname" ]; then
                ( cd "$LIBDEST" && ln -sf "$_real_base" "$_soname" )
              fi
              echo "OK  ldd-discovered: $_soname -> $_real_base (from $(basename "$so"))"
              _copied=$((_copied+1))
            done < "$TMP_LDD"
          done

          echo "== Total runtime libs pre-staged: $_copied =="
          ls -la "$LIBDEST" | head -n 40 || true

          # Sanity check: libffi.so.6 must now exist in AppDir/usr/lib.
          if ! ls "$LIBDEST"/libffi.so.6* >/dev/null 2>&1; then
            echo "FAIL: libffi.so.6 not present in $LIBDEST after staging step"
            exit 1
          fi

      - name: Stage desktop / icon / AppRun
        run: |
          set -eu
          # 1. Desktop entry (root + usr/share/applications).
          mkdir -p AppDir/usr/share/applications
          cp data/screenkey.desktop AppDir/usr/share/applications/
          cp data/screenkey.desktop AppDir/screenkey.desktop
          # Desktop entry's Exec= must be a bare binary name; AppRun provides
          # the wrapping. Icon is referenced by name (resolved via hicolor).
          # Modify BOTH desktop files (linuxdeploy reads from usr/share/applications).
          for f in AppDir/screenkey.desktop AppDir/usr/share/applications/screenkey.desktop; do
            sed -i 's|^Exec=.*|Exec=screenkey|' "$f"
            sed -i 's|^Icon=.*|Icon=screenkey|' "$f"
          done

          # 2. AppStream metainfo.
          mkdir -p AppDir/usr/share/metainfo
          cp data/org.thregr.screenkey.metainfo.xml AppDir/usr/share/metainfo/

          # 3. Icons: copy every size Adwaita exposes for input-keyboard.
          for sz in 16 22 24 32 48 64 96 256; do
            src="/usr/share/icons/Adwaita/${sz}x${sz}/devices/input-keyboard.png"
            if [ -f "$src" ]; then
              mkdir -p "AppDir/usr/share/icons/hicolor/${sz}x${sz}/apps"
              cp "$src" "AppDir/usr/share/icons/hicolor/${sz}x${sz}/apps/screenkey.png"
            fi
          done
          # Scalable fallback (svg).
          for src in /usr/share/icons/Adwaita/scalable/devices/input-keyboard-symbolic.svg \
                     /usr/share/icons/Adwaita/scalable/devices/input-keyboard.svg; do
            if [ -f "$src" ]; then
              mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
              cp "$src" AppDir/usr/share/icons/hicolor/scalable/apps/screenkey.svg
              break
            fi
          done
          # .DirIcon used by file managers (top-level).
          cp AppDir/usr/share/icons/hicolor/256x256/apps/screenkey.png AppDir/.DirIcon 2>/dev/null || true

          # 4. Project static assets referenced at runtime.
          mkdir -p AppDir/usr/share/screenkey/images
          cp Screenkey/images/mouse.svg AppDir/usr/share/screenkey/images/ 2>/dev/null || true
          # Compiled .mo locales were emitted under Screenkey/locale/*/*.mo
          # by `setup.py compile_catalog` and are already inside the copied
          # package directory in AppDir/usr/lib/python3.11/site-packages/Screenkey.

          # 5. AppRun: sets env vars so the bundled python/gtk find their data
          # inside AppDir, then exec's the launcher.
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          # PYTHONHOME makes the bundled CPython resolve its stdlib and
          # site-packages relative to AppDir/usr instead of the build-time
          # prefix (/opt/_internal/...) hardcoded in the python-build-standalone
          # binary. Without it Python cannot find `encodings` and aborts.
          export PYTHONHOME="$HERE/usr"
          export PYTHONPATH="$HERE/usr/lib/python3.11/site-packages:$PYTHONPATH"
          export GI_TYPELIB_PATH="$HERE/usr/lib/girepository-1.0:$GI_TYPELIB_PATH"
          export GDK_PIXBUF_MODULE_FILE="$HERE/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          export GTK_PATH="$HERE/usr/lib/gtk-3.0"
          export XDG_DATA_DIRS="$HERE/usr/share:$XDG_DATA_DIRS"
          export FONTCONFIG_PATH="$HERE/etc/fonts"

          # Make bundled CLI tools (slop, etc.) discoverable when screenkey
          # invokes them via subprocess (screenkey.py: on_btn_sel_geom runs
          # `slop -f '%x %y %w %h %i'`). Prepending $HERE/usr/bin means the
          # in-image slop wins over any host slop of a different version.
          export PATH="$HERE/usr/bin:$PATH"

          # --------------------------------------------------------------------
          # Library search path: CLOSED inside the image, NO host fallbacks.
          # --------------------------------------------------------------------
          # Why not just `$HERE/usr/lib`?  Two real failures we've seen:
          #
          #   * Python's stdlib C extensions live under
          #       $HERE/usr/lib/python3.11/lib-dynload/_ctypes.cpython-311-*.so
          #     These are `dlopen()'d at runtime so linuxdeploy never scans
          #     them; their NEEDED entries (libffi.so.6, libssl.so.1.1, ...)
          #     are resolved by the loader AFTER the main binary starts, at
          #     which point the loader must be able to find libffi via
          #     LD_LIBRARY_PATH / DT_RUNPATH of the caller.
          #
          #   * Even when linuxdeploy-plugin-gtk DOES copy `libfreetype.so.6`
          #     and `libharfbuzz.so.0` into usr/lib, the dynamic loader has
          #     this nasty habit of "reusing" an already-open SONAME from the
          #     host.  On Kali the host `libharfbuzz.so.0` is 8.x and links
          #     against a host `libfreetype.so.6` that exports
          #     `FT_Get_Color_Glyph_Layer' — a symbol that the *bundled*
          #     freetype does NOT have.  Result: the loader opens the host
          #     harfbuzz, tries to satisfy its import against the bundled
          #     freetype, and dies with
          #       undefined symbol: FT_Get_Color_Glyph_Layer
          #     which then cascades to `gi.overrides.Gdk AssertionError`
          #     because `libgdk-3.so.0`'s typelib load aborts.
          #
          # To defeat *both* bugs we (a) ship EVERY NEEDED lib of the
          # bundled libpython/libgtk/python dynload files inside usr/lib (see
          # the "Stage python-dynload runtime libs" + "Close transitive lib
          # closure" steps), and (b) put `$HERE/usr/lib` FIRST in
          # LD_LIBRARY_PATH *and* list the python dynload dir and the
          # x86_64-linux-gnu multiarch path so dlopen() inside C extensions
          # resolves against the image, never the host.
          export LD_LIBRARY_PATH="$HERE/usr/lib/python3.11/lib-dynload:$HERE/usr/lib:$HERE/usr/lib/x86_64-linux-gnu:$HERE/lib:$HERE/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          #
          # GI repository typelibs (e.g. Gdk-3.0.typelib) can be loaded from
          # more places than just GI_TYPELIB_PATH; to be 100% explicit we
          # also prepend the in-image lib dirs to the XDG data search.
          export XDG_DATA_DIRS="$HERE/usr/lib:$HERE/usr/share:$XDG_DATA_DIRS"

          # -s: don't add user site-packages. -E must NOT be used: it would
          # ignore PYTHONHOME/PYTHONPATH and break stdlib + site-packages
          # resolution inside the AppImage.
          exec "$HERE/usr/bin/python3.11" -s "$HERE/usr/bin/screenkey" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Download linuxdeploy + appimagetool + GTK plugin
        run: |
          set -eu
          # linuxdeploy (continuous build). FUSE is unavailable inside the
          # container, so we extract the AppImage and run from squashfs-root.
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract >/dev/null
          rm linuxdeploy-x86_64.AppImage
          mv squashfs-root linuxdeploy
          # appimagetool (also extracted).
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract >/dev/null
          rm appimagetool-x86_64.AppImage
          mv squashfs-root appimagetool
          # GTK3 plugin for linuxdeploy: bundles libgtk-3, girepository,
          # gdk-pixbuf loaders, themes and fonts needed by GTK apps.
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-plugin-gtk.sh

      - name: Bundle runtime deps into AppDir (linuxdeploy + GTK plugin)
        env:
          DEPLOY_GTK_VERSION: "3"
          ARCH: x86_64
          APPDIR: ${{ github.workspace }}/AppDir
        run: |
          set -eu
          export LD_LIBRARY_PATH="/usr/lib:/usr/lib64:$LD_LIBRARY_PATH"
          # linuxdeploy walks the AppDir, finds the desktop file, follows the
          # Exec/Icon references and copies every required .so (including GTK,
          # girepository, gdk-pixbuf loaders) into AppDir/usr/lib. The GTK
          # plugin additionally sets up loaders.cache, themes and fonts.
          ./linuxdeploy/AppRun \
            --appdir AppDir \
            --desktop-file AppDir/screenkey.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/screenkey.png \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/screenkey.svg \
            --plugin gtk

      - name: Bundle slop binary into AppDir
        # screenkey invokes `slop` as an external subprocess for the
        # interactive region/window selection feature (see
        # Screenkey/screenkey.py: on_btn_sel_geom). slop is NOT picked up
        # by linuxdeploy (which only follows the desktop Exec= binary), so
        # we stage it manually here. The subsequent "Close transitive lib
        # closure" step scans AppDir/usr/bin/* with ldd and will copy every
        # NEEDED .so (libX11, libXext, libXrender, libGL, libglew, libpng,
        # libcairo, ...) into AppDir/usr/lib automatically.
        run: |
          set -eu
          mkdir -p AppDir/usr/bin
          SLOP_SRC="$(command -v slop || true)"
          if [ -z "$SLOP_SRC" ]; then
            echo "FATAL: slop binary not found on the build host (was the 'slop' dnf package installed?)" >&2
            exit 1
          fi
          cp -a "$SLOP_SRC" AppDir/usr/bin/slop
          chmod 0755 AppDir/usr/bin/slop
          echo "Bundled slop: $SLOP_SRC -> AppDir/usr/bin/slop"
          echo "slop version: $(slop --version 2>&1 || echo 'unknown')"
          echo "Direct NEEDED libs (transitive closure handled later):"
          ldd AppDir/usr/bin/slop || true

      - name: Close transitive lib closure + patch ELF RUNPATH (post-linuxdeploy)
        run: |
          set -eu
          # ------------------------------------------------------------------
          # Why this step exists.
          # ------------------------------------------------------------------
          # linuxdeploy-plugin-gtk copies a curated list of GTK libraries but
          # it explicitly DECLINES to copy certain libs that it believes are
          # "provided by the distro" (e.g. libfreetype, libharfbuzz on some
          # builds, libffi, libz ...).  That's fine for AppImages that run on
          # a distro ABI-compatible with the build host — but screenkey is
          # built on AlmaLinux 8 (glibc 2.28, libffi .so.6, freetype 2.9.x)
          # and then runs on distros where:
          #
          #   * libffi.so.6 does NOT exist (Kali, Ubuntu 24.04+, Arch → only
          #     libffi.so.8).  Error: ImportError: libffi.so.6: cannot open
          #     shared object file.
          #   * libharfbuzz.so.0 EXISTS but is a newer major version built
          #     against a newer freetype (symbol FT_Get_Color_Glyph_Layer
          #     missing from the bundled freetype). Error: undefined symbol
          #     followed by gi.overrides.Gdk AssertionError.
          #
          # The "Stage python-dynload runtime libs" step before linuxdeploy
          # already forces most of these into AppDir/usr/lib, but it runs
          # BEFORE the GTK plugin has a chance to add its own .so files. Here,
          # AFTER linuxdeploy, we do the full-closure pass for every ELF file
          # now present under AppDir/usr (bin/, lib/, python*/lib-dynload,
          # gtk-3.0 modules, gdk-pixbuf loaders, girepository private libs).
          # For every "=> /usr/lib64/libxxx" returned by ldd that points
          # OUTSIDE AppDir (i.e. the resolution would fall back to the host
          # at runtime), we copy the library into AppDir/usr/lib, closing the
          # loop once and for all.  glibc / libgcc / libstdc++ / ld-linux are
          # still skipped per AppImage project guidance.
          #
          # As a final belt-and-braces move, we also install patchelf from
          # EPEL (safe, no external deps) and write DT_RUNPATH=$ORIGIN/../lib
          # (+$ORIGIN/../lib/python3.11/lib-dynload for the python binary)
          # into every ELF executable and .so we touched.  RUNPATH is encoded
          # directly in the ELF header and evaluated BEFORE LD_LIBRARY_PATH,
          # so even if some downstream launcher strips LD_LIBRARY_PATH the
          # libraries still resolve correctly.
          LIBDEST="AppDir/usr/lib"
          mkdir -p "$LIBDEST"
          TMP_LDD2="$(mktemp /tmp/closure.XXXXXX 2>/dev/null || echo /tmp/_closure_screenkey)"
          TMP_FIND="$(mktemp /tmp/findelf.XXXXXX 2>/dev/null || echo /tmp/_findelf_screenkey)"
          trap 'rm -f "$TMP_LDD2" "$TMP_FIND"' EXIT INT TERM

          SKIP_PREFIXES="libc.so libdl.so libm.so libpthread.so librt.so libresolv.so libutil.so libnsl.so libnss_ libcrypt.so ld-linux ld-linux-x86 libgcc_s.so libstdc++.so libgpg-error.so"

          # 1. Gather every ELF file under AppDir/usr (bin/*.so, lib/*.so,
          #    python*/lib-dynload/*.so, gtk-3.0 modules/*/*.so, ...).
          find AppDir/usr -type f \( -path '*/bin/*' -o -name '*.so' -o -name '*.so.*' \) > "$TMP_FIND" 2>/dev/null || true

          echo "== Close transitive ldd closure over $(wc -l < "$TMP_FIND") ELF files =="

          # Iterate up to 8 rounds; each round may pull in new libs that in
          # turn bring further NEEDED entries.  8 rounds is way more than
          # enough for the GTK dependency graph.
          ROUND=0
          STAGED_THIS_ROUND=1
          while [ "$STAGED_THIS_ROUND" -gt 0 ] && [ "$ROUND" -lt 8 ]; do
            STAGED_THIS_ROUND=0
            ROUND=$((ROUND+1))
            while IFS= read -r elf; do
              [ -n "$elf" ] && [ -f "$elf" ] || continue
              # Only process actual ELF files (shell scripts, launcher .py
              # files, data files etc. will make ldd complain uselessly).
              case "$(file -b "$elf" 2>/dev/null)" in
                *ELF*) : ;;
                *) continue ;;
              esac
              ldd "$elf" > "$TMP_LDD2" 2>/dev/null || true
              while IFS= read -r line; do
                # Match lines of the form: libfoo.so.1 => /usr/lib64/libfoo.so.1 (0x...)
                dep="$(echo "$line" | sed -n 's/.*=>[[:space:]]*\(\/[^[:space:]]*\).*/\1/p')"
                [ -n "$dep" ] && [ -f "$dep" ] || continue
                soname="$(basename "$dep")"
                # Never bundle glibc / libgcc family.
                sk=0
                for pfx in $SKIP_PREFIXES; do
                  case "$soname" in "$pfx"*) sk=1; break ;; esac
                done
                [ "$sk" -eq 1 ] && continue
                # Skip if it points INTO AppDir already (linuxdeploy copied
                # it previously).  `case` prefix match is POSIX.
                case "$dep" in
                  AppDir/*|./AppDir/*|"$PWD"/AppDir/*) continue ;;
                  */AppDir/*) continue ;;
                esac
                # Already in LIBDEST?
                real="$(readlink -f "$dep")"
                real_base="$(basename "$real")"
                if [ -e "$LIBDEST/$soname" ] || [ -e "$LIBDEST/$real_base" ]; then
                  continue
                fi
                cp -a "$real" "$LIBDEST/$real_base"
                if [ "$soname" != "$real_base" ] && [ ! -e "$LIBDEST/$soname" ]; then
                  ( cd "$LIBDEST" && ln -sf "$real_base" "$soname" )
                fi
                echo "OK  closure round $ROUND: $soname -> $real_base (needed by $elf)"
                STAGED_THIS_ROUND=$((STAGED_THIS_ROUND+1))
              done < "$TMP_LDD2"
            done < "$TMP_FIND"
            echo "   round $ROUND staged $STAGED_THIS_ROUND new libs"
          done

          # 2. Sanity checks: critical libs we know we absolutely require.
          echo "== Post-closure sanity checks =="
          for check in "libffi.so.6" "libharfbuzz.so.0" "libfreetype.so.6" "libfontconfig.so.1" "libpango-1.0.so.0" "libgdk-3.so.0" "libgtk-3.so.0" "libdbus-1.so.3" "libexpat.so.1" "libz.so.1"; do
            if ls "$LIBDEST"/"$check"* >/dev/null 2>&1; then
              echo "OK  required: $check -> $(readlink -f "$LIBDEST"/"$check"* 2>/dev/null | head -n1)"
            else
              echo "WARN required: $check is NOT in usr/lib after closure pass"
            fi
          done

          # slop-specific sanity check: every direct NEEDED entry of the
          # bundled slop binary must now resolve against AppDir/usr/lib
          # (i.e. be present there). Anything still pointing at /usr/lib64
          # means the closure pass missed it and slop would fall back to the
          # host at runtime, which we want to avoid on no-slop distros.
          # We set LD_LIBRARY_PATH=AppDir/usr/lib when invoking ldd so the
          # resolver behaves exactly like at AppRun runtime (which prepends
          # $HERE/usr/lib to LD_LIBRARY_PATH).
          echo "== slop NEEDED libs sanity check =="
          if [ -f AppDir/usr/bin/slop ]; then
            slop_missing=0
            while IFS= read -r soname; do
              [ -n "$soname" ] || continue
              # Skip the SAME families the closure pass above intentionally
              # declines to bundle (glibc / libgcc / libstdc++ / libgpg-error /
              # ld-linux). Anything else MUST be in AppDir/usr/lib, otherwise
              # slop would silently fall back to the host on slop-less distros.
              case "$soname" in
                libc.so*|libdl.so*|libm.so*|libpthread.so*|librt.so*|libresolv.so*|libutil.so*|libnsl.so*|libnss_*|libcrypt.so*|ld-linux*|libgcc_s.so*|libstdc++.so*|libgpg-error.so*)
                  continue ;;
              esac
              if ! ls "$LIBDEST"/"$soname"* >/dev/null 2>&1; then
                echo "WARN slop dep $soname is NOT in AppDir/usr/lib"
                slop_missing=$((slop_missing+1))
              fi
            done < <(LD_LIBRARY_PATH="$LIBDEST" ldd AppDir/usr/bin/slop 2>/dev/null | sed -n 's/^[[:space:]]*\(lib[^[:space:]]*\).*/\1/p')
            echo "slop missing-lib count: $slop_missing"
            # Hard-fail if any non-system lib is still missing — slop would
            # fail at runtime on slop-less distros otherwise.
            if [ "$slop_missing" -gt 0 ]; then
              echo "FATAL: slop has $slop_missing unresolved non-system libs after closure pass" >&2
              exit 1
            fi
          else
            echo "WARN AppDir/usr/bin/slop not present, skipping slop lib check"
          fi

          # 3. If patchelf is available, inject DT_RUNPATH = $ORIGIN/../lib
          #    (plus dynload dir for the interpreter) into every AppImage ELF.
          #    This survives cases where LD_LIBRARY_PATH gets stripped by
          #    wrappers and also makes dlopen() from libpython resolve the
          #    lib-dynload module deps against usr/lib deterministically.
          if command -v patchelf >/dev/null 2>&1; then
            echo "== patchelf: injecting DT_RUNPATH into AppDir ELFs =="
            RPATH_COMMON='$ORIGIN/../lib:$ORIGIN/../lib/python3.11/lib-dynload:$ORIGIN/lib:$ORIGIN'
            patchelf_count=0
            while IFS= read -r elf; do
              [ -f "$elf" ] || continue
              case "$(file -b "$elf" 2>/dev/null)" in
                *ELF*executable*|*ELF*"shared object"*) : ;;
                *) continue ;;
              esac
              # Skip the runtime linker itself — patchelf on ld-linux breaks it.
              case "$(basename "$elf")" in ld-linux*) continue ;; esac
              if patchelf --set-rpath "$RPATH_COMMON" "$elf" 2>/dev/null; then
                patchelf_count=$((patchelf_count+1))
              else
                # --force-rpath fallback for targets where RUNPATH write would
                # otherwise require expanding the PT_LOAD segment.
                patchelf --force-rpath --set-rpath "$RPATH_COMMON" "$elf" 2>/dev/null \
                  && patchelf_count=$((patchelf_count+1)) \
                  || echo "SKIP patchelf: $elf (not writeable/too small segments)"
              fi
            done < "$TMP_FIND"
            echo "   patchelf runpath written to $patchelf_count ELFs"
          else
            echo "SKIP patchelf: binary not installed; relying on LD_LIBRARY_PATH from AppRun only"
          fi

      - name: Pack AppImage (extracted appimagetool, no FUSE)
        run: |
          set -eu
          # appimagetool was already extracted (squashfs-root -> appimagetool/)
          # in the previous step, so we can just invoke its AppRun directly —
          # no FUSE needed and no --appimage-extract-and-run flag required
          # (that flag only works on the outer .AppImage wrapper, not the
          # already-unpacked internal AppRun script).
          ./appimagetool/AppRun \
            --comp gzip \
            AppDir screenkey-x86_64.AppImage

      - name: Inspect AppImage
        run: |
          ls -la screenkey-*.AppImage
          file   screenkey-*.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenkey-AppImage-x86_64
          path: screenkey-*.AppImage
          if-no-files-found: error

      - name: Generate SHA256 checksum (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          # Filename is hardcoded by the "Pack AppImage" step above, so we
          # can derive the checksum filename deterministically.
          APPIMG="screenkey-x86_64.AppImage"
          [ -f "$APPIMG" ] || { echo "FATAL: $APPIMG not found" >&2; exit 1; }
          sha256sum "$APPIMG" > "${APPIMG}.sha256"
          echo "== SHA256 =="
          cat "${APPIMG}.sha256"

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Upload both the AppImage and its checksum file.
          files: |
            screenkey-x86_64.AppImage
            screenkey-x86_64.AppImage.sha256
          # Release title matches the tag name (e.g. "v1.5.2").
          name: ${{ github.ref_name }}
          # Let GitHub auto-generate release notes from commits/PRs since
          # the previous release. Our `body` below is prepended to those
          # auto-generated notes.
          generate_release_notes: true
          # Mark this as the "latest" release so it shows up on the repo
          # home page and `releases/latest` URL.
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Installation

            1. Download `screenkey-x86_64.AppImage`
            2. Make it executable: `chmod +x screenkey-x86_64.AppImage`
            3. Run: `./screenkey-x86_64.AppImage`

            ### Integrity verification (optional)

            Download both `screenkey-x86_64.AppImage` and
            `screenkey-x86_64.AppImage.sha256` into the same directory, then:

            ```bash
            sha256sum -c screenkey-x86_64.AppImage.sha256
            ```

            ## Bundled components

            This AppImage is fully self-contained:
            - CPython 3.11 (manylinux_2.28 / AlmaLinux 8 base, glibc 2.28+)
            - GTK 3 + Adwaita icon theme + Font Awesome + Noto CJK fonts
            - **slop** (interactive region/window selection)
